name: Comprobación
on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Código sin errores
        run: npm run lint
      - name: Tests (calendario, copias, cierre de temporada, informe del rival)
        run: npm test
      - name: Compila
        run: npm run build
